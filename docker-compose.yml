# Our services only. Joins the official MLflow stack's network by
# name rather than deriving it from a project/COMPOSE_PROJECT_NAME trick (gotcha 1).
#
# Bring both stacks up with:
#   docker compose -f mlflow-stack/docker-compose.yml up -d
#   docker compose -f mlflow-stack/docker-compose.yml -f docker-compose.yml up -d

services:
  # Override, not a copy: mlflow-stack/ stays untouched (gotcha 7), and Compose merges
  # this environment map into the vendored `mlflow` service's own. mlflow 3.8.1 added
  # Host-header validation that defaults to localhost + private IPs only (gotcha 13) —
  # without this, any request whose Host header is the Compose service
  # name (e.g. "mlflow:5000", as trainer/model-api send) gets a 403.
  mlflow:
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow,mlflow:*,localhost,localhost:*,127.0.0.1,127.0.0.1:*"

  trainer:
    build:
      context: .
      dockerfile: trainer/Dockerfile
    container_name: trainer
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    restart: "no"

  model-v1:
    build:
      context: .
      dockerfile: model-api/Dockerfile
    image: mlops-demo/model-api:latest
    container_name: model-v1
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/product-recommender/1
    ports:
      - "8001:8000"
    depends_on:
      trainer:
        condition: service_completed_successfully

  model-v2:
    build:
      context: .
      dockerfile: model-api/Dockerfile
    image: mlops-demo/model-api:latest
    container_name: model-v2
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/product-recommender/2
    ports:
      - "8002:8000"
    depends_on:
      trainer:
        condition: service_completed_successfully

  # Production, distinct from the A/B arms above: model-v1/model-v2 are pinned by version
  # number *on purpose*, because an experiment must name exactly which versions it is
  # comparing. This service is what @champion actually means at
  # runtime — the container promote_model.py / rollback_model.py's /reload targets, and
  # the one whose /health flips between v1 and v2 with no rebuild.
  model-champion:
    build:
      context: .
      dockerfile: model-api/Dockerfile
    image: mlops-demo/model-api:latest
    container_name: model-champion
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/product-recommender@champion
    ports:
      - "8003:8000"
    depends_on:
      trainer:
        condition: service_completed_successfully

  # Continuous Training orchestrator (Phase 8) — the official image,
  # unmodified, running `airflow standalone` (webserver + scheduler + triggerer + a SQLite
  # metadata DB, all in this one container). Deliberately not a production Airflow
  # deployment (separate webserver/scheduler/worker, Redis, its own Postgres) — the demo
  # needs one DAG to run reliably, not an Airflow cluster. Only orchestrates the
  # retraining DAG — it does not replace Compose as the infrastructure layer.
  airflow:
    image: apache/airflow:2.10.5-python3.12
    container_name: airflow
    # `airflow standalone` creates its own admin user with a random password (written to
    # standalone_admin_password.txt) unless one already exists — unlike `airflow
    # webserver`, it does NOT honor `_AIRFLOW_WWW_USER_USERNAME`/`_AIRFLOW_WWW_USER_PASSWORD`
    # (found running this service: the env vars were set but the password file still had a
    # random string). So the admin user is created explicitly first, with `|| true` for
    # idempotency across container restarts, then standalone reuses that existing user
    # instead of generating a new one — giving drift_monitor.py's --airflow-username/
    # --airflow-password defaults a predictable login.
    command: >
      bash -c "airflow db migrate &&
      (airflow users delete --username admin || true) &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com &&
      exec airflow standalone"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
      # `train`/`evaluate` (airflow/dags/continuous_training_dag.py) import mlflow and, via
      # trainer/train.py, pandas/scikit-learn/numpy/cloudpickle — not in the base image.
      # Reinstalled on every container start; slower but keeps this the unmodified
      # official image (no custom Dockerfile). See airflow/requirements.txt, which these
      # pins must mirror.
      _PIP_ADDITIONAL_REQUIREMENTS: "mlflow==3.8.1 pandas==2.3.3 scikit-learn==1.9.0 numpy==2.5.2 cloudpickle==3.1.2"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Where continuous_training_dag.py finds trainer/train.py and data/interactions.csv
      # inside this container — see the volumes below.
      CT_REPO_ROOT: /opt/airflow/repo
    volumes:
      - airflow-data:/opt/airflow
      - ./airflow/dags:/opt/airflow/dags
      - ./trainer:/opt/airflow/repo/trainer:ro
      - ./data:/opt/airflow/repo/data
    ports:
      - "8080:8080"
    depends_on:
      mlflow:
        condition: service_healthy

  # Our own small Postgres for A/B outcomes — deliberately not
  # mlflow-postgres: the experiment store is application data, not MLflow metadata.
  # schema.sql is mounted into docker-entrypoint-initdb.d, so Postgres creates
  # experiment_events itself the first time this container's volume is initialized.
  events-db:
    image: postgres:15
    container_name: events-db
    environment:
      POSTGRES_USER: ab_events
      POSTGRES_PASSWORD: ab_events
      POSTGRES_DB: ab_events
    volumes:
      - events-db-data:/var/lib/postgresql/data
      - ./ab-router/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ab_events -d ab_events"]
      interval: 5s
      timeout: 3s
      retries: 10

  ab-router:
    build:
      context: .
      dockerfile: ab-router/Dockerfile
    container_name: ab-router
    environment:
      EVENTS_DATABASE_URL: postgresql://ab_events:ab_events@events-db:5432/ab_events
      MODEL_V1_URL: http://model-v1:8000
      MODEL_V2_URL: http://model-v2:8000
      SPLIT_PCT: "50"
    ports:
      - "8000:8000"
    depends_on:
      events-db:
        condition: service_healthy
      model-v1:
        condition: service_healthy
      model-v2:
        condition: service_healthy

volumes:
  events-db-data:
  airflow-data:

networks:
  default:
    name: mlflow-network
    external: true
